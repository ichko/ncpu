[project]
name = "ncpu"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Iliya Zhechev", email = "iliya.zhechev@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "jupyter-bokeh>=4.0.5",
    "matplotlib>=3.10.7",
    "mediapy>=1.2.4",
    "numpy>=2.2.6",
    "opencv-python>=4.12.0.88",
    "panel>=1.8.3",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "tqdm>=4.67.1",
    "autoflake>=2.3.1",
    "black>=26.1.0",
    "flake8>=7.3.0",
    "nbstripout>=0.9.1",
    "streamlit>=1.55.0",
]


[project.scripts]
ncpu = "ncpu:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
